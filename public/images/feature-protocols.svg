<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#grad1)" />

  <!-- Grid pattern -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="400" height="300" fill="url(#grid)" />

  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">Supported Protocols</text>

  <!-- HTTP/1.1 Card -->
  <g transform="translate(20, 50)">
    <rect width="110" height="80" rx="0" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="55" y="20" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="11" font-weight="600" fill="#ec4899">HTTP/1.1</text>
    <path d="M20 35 L55 28 L90 35" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="50" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="9" fill="#94a3b8">Req/Resp</text>
    <text x="55" y="65" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="8" fill="#64748b">Pipeline</text>
  </g>

  <!-- HTTP/2 Card -->
  <g transform="translate(150, 50)">
    <rect width="110" height="80" rx="0" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="55" y="20" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="11" font-weight="600" fill="#ec4899">HTTP/2</text>
    <g stroke="#ec4899" stroke-width="1.5" fill="none" stroke-linecap="round">
      <line x1="20" y1="45" x2="40" y2="40"/>
      <line x1="30" y1="50" x2="50" y2="45"/>
      <line x1="40" y1="50" x2="60" y2="50"/>
      <line x1="50" y1="50" x2="70" y2="45"/>
    </g>
    <text x="55" y="60" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="9" fill="#94a3b8">Multiplex</text>
    <text x="55" y="72" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="8" fill="#64748b">Streams</text>
  </g>

  <!-- TLS Card -->
  <g transform="translate(280, 50)">
    <rect width="110" height="80" rx="0" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="55" y="20" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="11" font-weight="600" fill="#ec4899">TLS 1.2/1.3</text>
    <rect x="15" y="30" width="80" height="18" rx="0" fill="#ec4899" opacity="0.15" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="55" y="42" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" fill="#ec4899" font-weight="500">SNI / ALPN</text>
    <path d="M20 65 L55 55 L90 65" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="78" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="9" fill="#94a3b8">Handshake</text>
  </g>

  <!-- gRPC Card -->
  <g transform="translate(20, 150)">
    <rect width="110" height="80" rx="0" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="55" y="20" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="11" font-weight="600" fill="#ec4899">gRPC</text>
    <path d="M20 50 L55 42 L90 50" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="62" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="9" fill="#94a3b8">Unary/Stream</text>
    <text x="55" y="72" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="8" fill="#64748b">protobuf</text>
  </g>

  <!-- Redis Card -->
  <g transform="translate(150, 150)">
    <rect width="110" height="80" rx="0" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="55" y="20" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="11" font-weight="600" fill="#ec4899">Redis</text>
    <text x="55" y="38" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="10" fill="#ec4899" font-weight="500">RESP2/3</text>
    <path d="M15 55 L95 55" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6,3"/>
    <path d="M15 65 L95 65" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="55" y="75" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="8" fill="#64748b">Pipeline</text>
  </g>

  <!-- MySQL Card -->
  <g transform="translate(280, 150)">
    <rect width="110" height="80" rx="0" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="55" y="20" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="11" font-weight="600" fill="#ec4899">MySQL</text>
    <text x="55" y="38" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="10" fill="#ec4899" font-weight="500">COM_QUERY</text>
    <rect x="15" y="45" width="80" height="14" rx="0" fill="#ec4899" opacity="0.1" stroke="#ec4899" stroke-width="1"/>
    <text x="55" y="54" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" fill="#ec4899">Prepared</text>
    <text x="55" y="70" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="8" fill="#64748b">Full Query</text>
  </g>

  <!-- Accent line -->
  <line x1="20" y1="250" x2="380" y2="250" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
</svg>