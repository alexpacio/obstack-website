<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="200" height="200">
  <defs>
    <linearGradient id="featureGrad4" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#featureGrad4)"/>
  <!-- eBPF - kernel/userspace boundary -->
  <line x1="0" y1="100" x2="200" y2="100" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="100" y="95" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="8" font-weight="700" fill="#8b5cf6">KERNEL</text>
  <text x="100" y="108" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="8" font-weight="700" fill="#8b5cf6">USERSPACE</text>
  <!-- cgroup-skb programs -->
  <rect x="25" y="30" width="60" height="50" rx="0" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="55" y="55" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" font-weight="600" fill="#8b5cf6">cgroup_skb</text>
  <text x="55" y="65" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" fill="#8b5cf6">INGRESS</text>
  <rect x="25" y="120" width="60" height="50" rx="0" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="55" y="145" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" font-weight="600" fill="#8b5cf6">cgroup_skb</text>
  <text x="55" y="155" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" fill="#8b5cf6">EGRESS</text>
  <!-- Ring buffer -->
  <rect x="115" y="50" width="70" height="100" rx="0" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="150" y="45" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" font-weight="700" fill="#8b5cf6">RING BUF</text>
  <g fill="#8b5cf6" opacity="0.7">
    <rect x="120" y="60" width="60" height="8" rx="0"/>
    <rect x="120" y="75" width="55" height="8" rx="0" opacity="0.8"/>
    <rect x="120" y="90" width="65" height="8" rx="0" opacity="0.6"/>
    <rect x="120" y="105" width="50" height="8" rx="0" opacity="0.5"/>
    <rect x="120" y="120" width="58" height="8" rx="0" opacity="0.4"/>
    <rect x="120" y="135" width="62" height="8" rx="0" opacity="0.3"/>
  </g>
  <!-- Arrow kernel to userspace -->
  <path d="M85 70 L115 60" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.6"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>