<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="200" height="200">
  <defs>
    <linearGradient id="featureGrad5" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#featureGrad5)"/>
  <!-- OTLP Export Pipeline -->
  <rect x="20" y="60" width="55" height="80" rx="0" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="47" y="55" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" font-weight="700" fill="#06b6d4">SPANS</text>
  <g fill="#06b6d4" opacity="0.7">
    <rect x="25" y="70" width="45" height="10" rx="0"/>
    <rect x="25" y="85" width="45" height="10" rx="0" opacity="0.8"/>
    <rect x="25" y="100" width="45" height="10" rx="0" opacity="0.6"/>
    <rect x="25" y="115" width="45" height="10" rx="0" opacity="0.5"/>
    <rect x="25" y="130" width="45" height="10" rx="0" opacity="0.4"/>
  </g>
  <!-- Batch processor -->
  <rect x="80" y="75" width="40" height="50" rx="0" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="73" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" font-weight="700" fill="#06b6d4">BATCH</text>
  <g fill="#06b6d4" opacity="0.6">
    <rect x="85" y="85" width="30" height="6" rx="0"/>
    <rect x="85" y="95" width="30" height="6" rx="0" opacity="0.7"/>
    <rect x="85" y="105" width="30" height="6" rx="0" opacity="0.5"/>
    <rect x="85" y="115" width="30" height="6" rx="0" opacity="0.4"/>
  </g>
  <!-- HTTP/Protobuf -->
  <rect x="130" y="60" width="55" height="80" rx="0" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="157" y="55" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" font-weight="700" fill="#06b6d4">OTLP/HTTP</text>
  <text x="157" y="105" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" fill="#06b6d4">PROTOBUF</text>
  <g fill="#06b6d4" opacity="0.6">
    <rect x="135" y="75" width="45" height="8" rx="0"/>
    <rect x="135" y="90" width="45" height="8" rx="0" opacity="0.7"/>
    <rect x="135" y="105" width="45" height="8" rx="0" opacity="0.5"/>
    <rect x="135" y="120" width="45" height="8" rx="0" opacity="0.4"/>
  </g>
  <!-- Vector collector -->
  <rect x="65" y="145" width="70" height="25" rx="0" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="100" y="162" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="8" font-weight="700" fill="#06b6d4">VECTOR</text>
  <!-- Arrows -->
  <path d="M75 100 L80 100" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowhead5)"/>
  <path d="M120 100 L130 100" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowhead5)"/>
  <path d="M100 125 L100 145" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowhead5)"/>
  <defs>
    <marker id="arrowhead5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#06b6d4"/>
    </marker>
  </defs>
</svg>