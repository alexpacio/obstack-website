<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="200" height="200">
  <defs>
    <linearGradient id="featureGrad3" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#featureGrad3)"/>
  <!-- Bounded resources - queue with ceiling -->
  <rect x="40" y="30" width="120" height="140" rx="0" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <!-- Ceiling line -->
  <line x1="45" y1="40" x2="155" y2="40" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="100" y="37" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="8" font-weight="700" fill="#f59e0b">CEILING</text>
  <!-- Queue items -->
  <g fill="#f59e0b" opacity="0.8">
    <rect x="50" y="50" width="100" height="12" rx="0"/>
    <rect x="50" y="66" width="90" height="12" rx="0" opacity="0.8"/>
    <rect x="50" y="82" width="85" height="12" rx="0" opacity="0.7"/>
    <rect x="50" y="98" width="75" height="12" rx="0" opacity="0.6"/>
    <rect x="50" y="114" width="65" height="12" rx="0" opacity="0.5"/>
    <rect x="50" y="130" width="55" height="12" rx="0" opacity="0.4"/>
    <rect x="50" y="146" width="40" height="12" rx="0" opacity="0.3"/>
  </g>
  <!-- Drop indicator -->
  <path d="M160 80 L175 95 M160 95 L175 80" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <text x="168" y="108" text-anchor="middle" font-family="M Plus 1p, sans-serif" font-size="7" font-weight="700" fill="#ef4444">DROP</text>
</svg>